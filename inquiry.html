<style id="responsive-inline">
/* Universal responsive and accessibility layer — loaded after page-specific styles. */
:root{

}
html{
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  overflow-x:hidden;
  color-scheme:light;
}
body{
  min-width:0;
  max-width:100%;
  overflow-x:hidden;
  overflow-x:clip;
  -webkit-tap-highlight-color:rgba(198,161,91,.16);
}
main,.shell,section,header,footer,div,form{min-width:0}
img,svg,video,canvas{max-width:100%}
button,input,textarea,select{font:inherit;max-width:100%}
button,a,input,textarea,select{-webkit-tap-highlight-color:rgba(198,161,91,.16)}
button,a{touch-action:manipulation}
.shell{
  width:min(1180px,calc(100% - (2 * var(--site-gutter))))!important;
  margin-inline:auto!important;
}
:focus-visible{
  outline:3px solid rgba(198,161,91,.78);
  outline-offset:3px;
  border-radius:6px;
}
.page-back{min-height:var(--tap);min-width:var(--tap)}
.footer-links a{display:inline-flex;align-items:center;min-height:var(--tap)}

    <section class="inquiry-page" aria-label="Inquiry form">

      <form class="inquiry-form" id="inquiryForm">
        <div class="form-row">
          <div class="field">
            <label for="name">Name <span class="required">*</span></label>
            <input id="name" name="name" type="text" autocomplete="name" required />
          </div>
          <div class="field">
            <label for="company">Company / Brand</label>
            <input id="company" name="company" type="text" autocomplete="organization" />
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label for="email">Email <span class="required">*</span></label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="website">Website / Social</label>
            <input id="website" name="website" type="text" placeholder="Website or social link" />
          </div>
        </div>

        <div class="field">
          <label for="inquiry">Inquiry <span class="required">*</span></label>
          <textarea id="inquiry" name="inquiry" placeholder="Tell us about your inquiry..." required></textarea>
        </div>

        <input class="honeypot" type="text" name="_honey" tabindex="-1" autocomplete="off" />

        <div class="submit-wrap">
          <button class="submit-button" id="submitButton" type="submit">Send Inquiry</button>
          <div class="form-status" id="formStatus" role="status" aria-live="polite"></div>
        </div>
        <p class="privacy-note">Information submitted here is used to respond to your inquiry. <a href="privacy.html">Privacy</a></p>
      </form>
    </section>

    <script>
      const inquiryForm = document.getElementById('inquiryForm');
      const submitButton = document.getElementById('submitButton');
      const formStatus = document.getElementById('formStatus');

      inquiryForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!inquiryForm.reportValidity()) return;

        submitButton.disabled = true;
        submitButton.textContent = 'Sending…';
        formStatus.className = 'form-status';
        formStatus.textContent = '';

        const payload = Object.fromEntries(new FormData(inquiryForm).entries());
        payload._subject = 'New Art by Liz Website Inquiry';
        payload._template = 'table';
        payload._replyto = payload.email;

        try {
          const response = await fetch('https://formsubmit.co/ajax/dante@ideationint.com', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify(payload)
          });

          const result = await response.json();
          if (!response.ok || result.success === false) throw new Error('Submission failed');

          inquiryForm.reset();
          formStatus.className = 'form-status success';
          formStatus.textContent = 'Inquiry sent. Thank you.';
        } catch (error) {
          formStatus.className = 'form-status error';
          formStatus.textContent = 'Could not send right now. Please try again.';
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = 'Send Inquiry';
        }
      });
    </script>
